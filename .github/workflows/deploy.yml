name: Deploy to GitHub Pages

on:
  push:
    branches: [main, chore/disallow-raw-html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-markdown:
    if: github.ref == 'refs/heads/chore/disallow-raw-html'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronize lockfile
        id: lock
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit synchronized lockfile
        if: steps.lock.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push
      - name: Install dependencies
        if: steps.lock.outputs.changed == 'false'
        run: npm ci
      - name: Build existing content
        if: steps.lock.outputs.changed == 'false'
        run: npm run build
      - name: Verify fenced HTML remains valid Markdown
        if: steps.lock.outputs.changed == 'false'
        run: |
          cat > src/content/notes/__markdown-guard-test.md <<'EOF'
          ---
          title: "Markdown guard test"
          description: "Temporary validation fixture"
          date: 2026-08-23
          draft: false
          ---

          ```html
          <div>This is displayed as code.</div>
          ```
          EOF
          npm run build
      - name: Verify raw HTML is rejected
        if: steps.lock.outputs.changed == 'false'
        run: |
          printf '\n<div>This must fail the build.</div>\n' >> src/content/notes/__markdown-guard-test.md
          if npm run build; then
            echo "Expected raw HTML validation to fail."
            exit 1
          fi
          rm src/content/notes/__markdown-guard-test.md
      - name: Mark verification complete
        if: steps.lock.outputs.changed == 'false'
        run: |
          if test -f .markdown-guard-verified; then
            exit 0
          fi
          printf 'verified\n' > .markdown-guard-verified
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .markdown-guard-verified
          git commit -m "ci: mark markdown guard verified"
          git push

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

name: Verify Markdown guard

on:
  push:
    branches:
      - chore/disallow-raw-html
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - name: Verify raw HTML is rejected
        run: |
          cat > src/content/notes/__raw-html-test.md <<'EOF'
          ---
          title: "Raw HTML test"
          description: "Temporary validation fixture"
          date: 2026-08-23
          draft: false
          ---

          <div>This must fail the build.</div>
          EOF

          if npm run build; then
            echo "Expected raw HTML validation to fail."
            exit 1
          fi

          rm src/content/notes/__raw-html-test.md
      - name: Commit synchronized lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore: sync package lock"
          git push
